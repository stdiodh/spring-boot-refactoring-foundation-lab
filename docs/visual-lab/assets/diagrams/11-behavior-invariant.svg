<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" aria-labelledby="title desc">
  <title id="title">Service 변경을 구조 리팩터링과 동작 보강으로 분리</title>
  <desc id="desc">왼쪽 구조 리팩터링 lane은 기존 Service assertion subset을 유지하며 response 변환 책임을 재배치합니다. 오른쪽 동작 보강 lane은 trim, validation, UserNotFound를 새 테스트로 확인하고 explicit update save는 코드에서 따로 확인합니다.</desc>
  <metadata>Source: A&amp;I Sequence 11 theory, implementation, checklist, PostServiceTest, AuthServiceTest. License: repository policy; no standalone license grant.</metadata>
  <defs>
    <marker id="arrow-blue" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#2955e4"/>
    </marker>
    <marker id="arrow-teal" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#087f78"/>
    </marker>
  </defs>
  <rect width="720" height="500" rx="22" fill="#f1f7ff"/>
  <text x="24" y="45" fill="#111b3f" font-family="system-ui, sans-serif" font-size="29" font-weight="850">TWO CHANGE LANES</text>
  <text x="696" y="43" text-anchor="end" fill="#6473a0" font-family="ui-monospace, monospace" font-size="24" font-weight="700">SEQ 11</text>

  <rect x="20" y="72" width="330" height="314" rx="16" fill="#ffffff" stroke="#2955e4" stroke-width="3"/>
  <text x="42" y="108" fill="#0c2691" font-family="system-ui, sans-serif" font-size="24" font-weight="900">구조 리팩터링 lane</text>
  <text x="42" y="137" fill="#6473a0" font-family="system-ui, sans-serif" font-size="24">기존 assertion subset</text>
  <rect x="42" y="158" width="286" height="54" rx="11" fill="#eaf0fb" stroke="#6473a0" stroke-width="2"/>
  <text x="185" y="181" text-anchor="middle" fill="#111b3f" font-family="system-ui, sans-serif" font-size="24" font-weight="800">BEFORE RESULT</text>
  <text x="185" y="205" text-anchor="middle" fill="#6473a0" font-family="system-ui, sans-serif" font-size="24">create · login</text>
  <path d="M185 213V241" stroke="#2955e4" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <rect x="42" y="248" width="286" height="54" rx="11" fill="#ecfbfa" stroke="#6473a0" stroke-width="2"/>
  <text x="185" y="281" text-anchor="middle" fill="#0c2691" font-family="system-ui, sans-serif" font-size="24" font-weight="800">response helper 재배치</text>
  <path d="M185 303V331" stroke="#2955e4" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <rect x="42" y="338" width="286" height="30" rx="9" fill="#0c2691"/>
  <text x="185" y="361" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="24" font-weight="800">기존 subset PASS</text>

  <rect x="370" y="72" width="330" height="314" rx="16" fill="#ffffff" stroke="#087f78" stroke-width="3"/>
  <text x="392" y="108" fill="#075e59" font-family="system-ui, sans-serif" font-size="24" font-weight="900">동작 보강 lane</text>
  <text x="392" y="137" fill="#6473a0" font-family="system-ui, sans-serif" font-size="24">test + code evidence</text>
  <rect x="392" y="158" width="286" height="54" rx="11" fill="#ecfbfa" stroke="#6473a0" stroke-width="2"/>
  <text x="535" y="181" text-anchor="middle" fill="#111b3f" font-family="system-ui, sans-serif" font-size="24" font-weight="800">NEW CASES</text>
  <text x="535" y="205" text-anchor="middle" fill="#6473a0" font-family="system-ui, sans-serif" font-size="24">trim · blank · missing</text>
  <path d="M535 213V241" stroke="#087f78" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <rect x="392" y="248" width="286" height="54" rx="11" fill="#eaf0fb" stroke="#6473a0" stroke-width="2"/>
  <text x="535" y="272" text-anchor="middle" fill="#075e59" font-family="system-ui, sans-serif" font-size="24" font-weight="800">TEST · 값과 예외</text>
  <text x="535" y="297" text-anchor="middle" fill="#075e59" font-family="system-ui, sans-serif" font-size="24" font-weight="800">CODE · update save</text>
  <path d="M535 303V331" stroke="#087f78" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <rect x="392" y="338" width="286" height="30" rx="9" fill="#087f78"/>
  <text x="535" y="361" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="24" font-weight="800">TEST PASS + CODE 확인</text>

  <rect x="20" y="407" width="680" height="70" rx="14" fill="#111b3f"/>
  <text x="42" y="437" fill="#ffffff" font-family="system-ui, sans-serif" font-size="24" font-weight="900">완료 판정</text>
  <text x="42" y="466" fill="#d9e5ff" font-family="system-ui, sans-serif" font-size="24">기존 subset PASS + 새 test PASS + code 확인</text>
</svg>
