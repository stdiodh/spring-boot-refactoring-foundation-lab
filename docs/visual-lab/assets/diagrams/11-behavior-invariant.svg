<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 52 720 460" role="img" aria-labelledby="title desc">
  <title id="title">Service 변경을 구조 리팩터링과 동작 보강으로 분리</title>
  <desc id="desc">구조 리팩터링 lane은 시스템 밖 기존 test와 assertion 사이에서 서비스·정책 response helper 위치만 옮기고, 동작 보강 lane은 새 test가 서비스·정책 validation과 상태·데이터 Repository save를 확인해 두 변경 종류의 증거를 분리하는 지도</desc>
  <metadata>Source: A&amp;I Sequence 11 theory, implementation, checklist, PostServiceTest, AuthServiceTest. License: repository policy; no standalone license grant.</metadata>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#2955E4"/></marker>
    <style>
      text{font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif;fill:#111B3F}
      .lane{fill:#FFFFFF;stroke:#94A3B8;stroke-width:2.5}
      .node{stroke-width:2.5}
      .layer-outside{fill:#F1F5F9;stroke:#5B677A}
      .layer-interface{fill:#E6F4F7;stroke:#0E7490}
      .layer-application{fill:#F2EDFF;stroke:#6D43A8}
      .layer-resource{fill:#EAF5EE;stroke:#2C7352}
      .layer-integration{fill:#FFF4D6;stroke:#926000}
      .layer-runtime{fill:#EEF2F7;stroke:#52627A}
      [data-layer="outside"] .layer{fill:#5B677A}
      [data-layer="resource"] .layer{fill:#2C7352}
      .flow{fill:none;stroke:#2955E4;stroke-width:3;marker-end:url(#arrow)}
      .pass{fill:#EAF7F1;stroke:#176F72;stroke-width:2.5}
      .lane-name{font-size:27px;font-weight:900;fill:#0C2691}
      .lane-desc{font-size:25px;font-weight:650;fill:#4B587C}
      .layer{font-size:25px;font-weight:850;fill:#4B587C;text-anchor:middle}
      .name{font-size:25px;font-weight:850;text-anchor:middle}
      .body{font-size:25px;font-weight:650;fill:#4B587C;text-anchor:middle}
      .pass-name{font-size:25px;font-weight:900;fill:#176F72;text-anchor:middle}
    </style>
  </defs>
  <rect width="720" height="560" rx="22" fill="#F8F9FB"/>
  <g data-semantic="lane">
    <rect x="19" y="68" width="332" height="430" rx="16" class="lane"/>
    <text x="38" y="102" class="lane-name">구조 리팩터링</text>
    <text x="38" y="135" class="lane-desc">create·login 결과 유지</text>
  </g>
  <g data-layer="outside">
    <rect x="40" y="148" width="289" height="76" rx="11" class="node layer-outside"/>
    <text x="184.5" y="172" class="layer">시스템 밖</text>
    <text x="184.5" y="204" class="name">기존 test</text>
  </g>
  <path d="M184.5 224v20" class="flow"/>
  <g data-layer="application">
    <rect x="40" y="250" width="289" height="82" rx="11" class="node layer-application"/>
    <text x="184.5" y="274" class="layer">서비스·정책</text>
    <text x="184.5" y="306" class="name">response helper 재배치</text>
  </g>
  <path d="M184.5 332v20" class="flow"/>
  <g data-layer="outside">
    <rect x="40" y="358" width="289" height="62" rx="11" class="node layer-outside"/>
    <text x="184.5" y="382" class="layer">시스템 밖</text>
    <text x="184.5" y="412" class="name">기존 assertion</text>
  </g>
  <g data-semantic="state">
    <rect x="40" y="426" width="289" height="58" rx="9" class="pass"/>
    <text x="184.5" y="462" class="pass-name">✓ 기존 검사 통과</text>
  </g>

  <g data-semantic="lane">
    <rect x="369" y="68" width="332" height="430" rx="16" class="lane"/>
    <text x="389" y="102" class="lane-name">동작 보강</text>
    <text x="389" y="135" class="lane-desc">trim·blank·missing 추가</text>
  </g>
  <g data-layer="outside">
    <rect x="391" y="148" width="289" height="76" rx="11" class="node layer-outside"/>
    <text x="535.5" y="172" class="layer">시스템 밖</text>
    <text x="535.5" y="204" class="name">새 test cases</text>
  </g>
  <path d="M535.5 224v16" class="flow"/>
  <g data-layer="application">
    <rect x="391" y="246" width="289" height="76" rx="11" class="node layer-application"/>
    <text x="535.5" y="270" class="layer">서비스·정책</text>
    <text x="535.5" y="302" class="name">값 정리·검증·예외</text>
  </g>
  <path d="M535.5 322v16" class="flow"/>
  <g data-layer="resource">
    <rect x="391" y="344" width="289" height="76" rx="11" class="node layer-resource"/>
    <text x="535.5" y="368" class="layer">상태·데이터</text>
    <text x="535.5" y="400" class="name">Repository save</text>
  </g>
  <g data-semantic="state">
    <rect x="391" y="426" width="289" height="58" rx="9" class="pass"/>
    <text x="535.5" y="462" class="pass-name">✓ 새 증거 확인</text>
  </g>
</svg>
